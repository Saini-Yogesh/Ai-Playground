<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Debate Playground — Transcript Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 24, 38, 0.75);
      --bg-card-hover: rgba(28, 36, 56, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --agent-a: #06b6d4;
      --agent-a-glow: rgba(6, 182, 212, 0.15);
      --agent-a-border: rgba(6, 182, 212, 0.3);
      
      --agent-b: #a855f7;
      --agent-b-glow: rgba(168, 85, 247, 0.15);
      --agent-b-border: rgba(168, 85, 247, 0.3);
      
      --topic-glow: rgba(245, 158, 11, 0.15);
      --topic-border: rgba(245, 158, 11, 0.35);
      --topic-color: #f59e0b;
      
      --success: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--agent-a), var(--agent-b));
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
    }

    /* Main Container */
    .app-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 65px);
    }

    /* Sidebar */
    .sidebar {
      background: rgba(13, 18, 30, 0.6);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1.25rem;
      gap: 1.25rem;
      position: sticky;
      top: 76px;
      height: calc(100vh - 76px);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .debate-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .debate-item {
      padding: 0.9rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .debate-item:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(3px);
    }

    .debate-item.active {
      border-color: var(--agent-a);
      background: rgba(6, 182, 212, 0.08);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.1);
    }

    .debate-item-topic {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .debate-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-running {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .badge-failed {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .message-card.error-card {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.06), rgba(18, 24, 38, 0.75));
      border-color: rgba(239, 68, 68, 0.35);
      border-left: 4px solid #f87171;
    }

    .avatar-error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .error-notice-card {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      color: #fca5a5;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .error-notice-title {
      font-weight: 700;
      color: #f87171;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Main Debate Viewer */
    .chat-area {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 1.75rem 2.5rem;
      gap: 1.5rem;
    }

    /* Debate Banner Card */
    .debate-banner {
      background: linear-gradient(135deg, rgba(24, 32, 52, 0.9), rgba(15, 21, 37, 0.9));
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .banner-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .debate-title-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--topic-color);
      margin-bottom: 0.25rem;
    }

    .debate-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: #fff;
    }

    .agent-pill-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .agent-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .agent-pill-a {
      background: var(--agent-a-glow);
      border: 1px solid var(--agent-a-border);
      color: var(--agent-a);
    }

    .agent-pill-b {
      background: var(--agent-b-glow);
      border: 1px solid var(--agent-b-border);
      color: var(--agent-b);
    }

    /* Message Bubbles */
    .message-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
    }

    .message-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .message-card.topic-card {
      background: rgba(245, 158, 11, 0.04);
      border-color: var(--topic-border);
    }

    .message-card.agent-a {
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.04), rgba(18, 24, 38, 0.75));
      border-color: var(--agent-a-border);
      border-left: 4px solid var(--agent-a);
    }

    .message-card.agent-b {
      background: linear-gradient(180deg, rgba(168, 85, 247, 0.04), rgba(18, 24, 38, 0.75));
      border-color: var(--agent-b-border);
      border-left: 4px solid var(--agent-b);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .speaker-identity {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .avatar-topic {
      background: var(--topic-glow);
      color: var(--topic-color);
      border: 1px solid var(--topic-border);
    }

    .avatar-a {
      background: var(--agent-a-glow);
      color: var(--agent-a);
      border: 1px solid var(--agent-a-border);
    }

    .avatar-b {
      background: var(--agent-b-glow);
      color: var(--agent-b);
      border: 1px solid var(--agent-b-border);
    }

    .speaker-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .turn-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .message-body {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .message-body p {
      margin-bottom: 0.75rem;
    }

    .message-body p:last-child {
      margin-bottom: 0;
    }

    .message-body strong {
      color: #f8fafc;
      font-weight: 700;
    }

    .message-body em {
      color: #e2e8f0;
      font-style: italic;
    }

    .message-body ul, .message-body ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .message-body li {
      margin-bottom: 0.25rem;
    }

    .message-body code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
      color: #38bdf8;
    }

    .message-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-dim);
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 1rem;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.5;
    }

    .agent-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .agent-detail-card {
      border-radius: var(--radius-md);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .agent-detail-card.card-a {
      background: var(--agent-a-glow);
      border: 1px solid var(--agent-a-border);
    }

    .agent-detail-card.card-b {
      background: var(--agent-b-glow);
      border: 1px solid var(--agent-b-border);
    }

    .agent-detail-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .agent-detail-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .agent-detail-value {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .agent-system-prompt {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 0.45rem;
      margin-top: 0.1rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .turn-progress {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .turn-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 9999px;
      overflow: hidden;
    }

    .turn-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--agent-a), var(--agent-b));
    }

    @media (max-width: 700px) {
      .agent-detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        max-height: 300px;
      }
      .chat-area {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">⚔️</div>
      <div>
        <div class="brand-title">AI Debate Playground</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="refreshBtn" onclick="fetchDebateList()">
        <span>🔄 Refresh</span>
      </button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    
    <!-- Sidebar: Debate List -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Saved Debates</span>
        <span class="badge badge-success" id="debateCountBadge">0</span>
      </div>
      <!-- Debate Switcher List -->
      <div class="debate-list" id="debateList"></div>
    </aside>

    <!-- Main Chat Feed Area -->
    <main class="chat-area" id="chatArea">
      <!-- Debate content dynamically rendered here -->
    </main>

  </div>

  <script>
    let currentDebateId = null;

    const debateListEl = document.getElementById('debateList');
    const chatAreaEl = document.getElementById('chatArea');
    const debateCountBadge = document.getElementById('debateCountBadge');

    // Fetch all debates from the local server and render the sidebar
    async function fetchDebateList() {
      debateListEl.innerHTML = `<div style="color:var(--text-dim);font-size:0.85rem;padding:0.5rem 0;">Loading...</div>`;
      try {
        const res = await fetch('/api/debates');
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const debates = await res.json();
        renderSidebar(debates);
        // If a debate is already open, reload it so backend changes appear
        if (currentDebateId) selectDebate(currentDebateId);
      } catch (err) {
        debateListEl.innerHTML = `
          <div style="color:#f87171;font-size:0.82rem;line-height:1.5;padding:0.5rem 0;">
            ⚠️ Could not load debates.<br>
            Make sure you ran <code style="background:rgba(255,255,255,0.08);padding:0.1rem 0.3rem;border-radius:4px;">npm run viewer</code> first.
          </div>`;
        debateCountBadge.textContent = '0';
      }
    }

    function getStatusBadgeClass(status) {
      const s = (status || '').toLowerCase();
      if (s === 'completed') return 'badge-success';
      if (s === 'failed' || s === 'error') return 'badge-failed';
      if (s === 'running' || s === 'created') return 'badge-running';
      return 'badge-success';
    }

    function renderMarkdown(text) {
      if (!text) return '';
      try {
        if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
          return marked.parse(text);
        }
      } catch (e) {
        console.warn('Marked parsing fallback:', e);
      }
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n\n/g, '<br><br>');
    }

    function renderSidebar(debates) {
      debateListEl.innerHTML = '';
      debateCountBadge.textContent = `${debates.length}`;

      if (debates.length === 0) {
        debateListEl.innerHTML = `<div style="color:var(--text-dim);font-size:0.85rem;padding:0.5rem 0;">No debates found in <code>data/debates/</code>. Run a debate first with <code>npm run dev</code>.</div>`;
        return;
      }

      debates.forEach((debate) => {
        const item = document.createElement('div');
        item.className = `debate-item ${debate.filename === currentDebateId ? 'active' : ''}`;
        item.id = `debate-item-${debate.filename}`;
        item.onclick = () => selectDebate(debate.filename);

        const dateStr = debate.createdAt
          ? new Date(debate.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
          : 'Recent';
        const badgeClass = getStatusBadgeClass(debate.status);

        item.innerHTML = `
          <div class="debate-item-topic">${escapeHtml(debate.topic || 'Untitled Debate')}</div>
          <div class="debate-item-meta">
            <span>${debate.turn ?? '?'} / ${debate.maxTurns ?? '?'} turns · ${dateStr}</span>
            <span class="badge ${badgeClass}">${escapeHtml(debate.status || 'completed')}</span>
          </div>
        `;
        debateListEl.appendChild(item);
      });

      // Auto-select the first debate if none selected
      if (!currentDebateId && debates.length > 0) {
        selectDebate(debates[0].filename);
      }
    }

    // Fetch and render a single debate by ID
    async function selectDebate(id) {
      // Mark active in sidebar immediately
      document.querySelectorAll('.debate-item').forEach(el => el.classList.remove('active'));
      const itemEl = document.getElementById(`debate-item-${id}`);
      if (itemEl) itemEl.classList.add('active');

      chatAreaEl.innerHTML = `<div class="empty-state"><div class="empty-icon">⏳</div><p>Loading debate...</p></div>`;
      currentDebateId = id;

      try {
        const res = await fetch(`/api/debates/${id}`);
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const debate = await res.json();
        renderChatArea(debate);
      } catch (err) {
        chatAreaEl.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p>Failed to load debate: ${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderChatArea(debate) {
      if (!debate) {
        chatAreaEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">💬</div>
            <h2>No Debate Selected</h2>
            <p>Select a debate from the sidebar.</p>
          </div>
        `;
        return;
      }

      const agentAName    = debate.customAgents?.A?.name         || 'Agent A';
      const agentBName    = debate.customAgents?.B?.name         || 'Agent B';
      const agentAModel   = debate.customAgents?.A?.model        || '—';
      const agentBModel   = debate.customAgents?.B?.model        || '—';
      const agentAPrompt  = debate.customAgents?.A?.systemPrompt || '';
      const agentBPrompt  = debate.customAgents?.B?.systemPrompt || '';
      const turnPct       = debate.maxTurns ? Math.round((debate.turn / debate.maxTurns) * 100) : 0;
      const badgeClass    = getStatusBadgeClass(debate.status);

      let html = `
        <!-- Debate Banner -->
        <div class="debate-banner">

          <!-- Topic + Status -->
          <div class="banner-top">
            <div>
              <div class="debate-title-label">Debate Proposition</div>
              <h1 class="debate-title">${escapeHtml(debate.topic)}</h1>
            </div>
            <span class="badge ${badgeClass}">${escapeHtml((debate.status || '').toUpperCase())}</span>
          </div>

          <!-- Turn progress bar -->
          <div class="turn-progress">
            <span>Turn ${debate.turn ?? 0} / ${debate.maxTurns ?? '?'}</span>
            <div class="turn-bar"><div class="turn-bar-fill" style="width:${turnPct}%"></div></div>
            <span>${turnPct}%</span>
          </div>
          ${debate.error ? `
            <div class="error-notice-card">
              <div class="error-notice-title">⚠️ Debate Stopped (API Error / Rate Limit Exceeded)</div>
              <div>${escapeHtml(debate.error)}</div>
            </div>
          ` : ''}

          <!-- Agent Detail Cards -->
          <div class="agent-detail-grid">
            <div class="agent-detail-card card-a">
              <div class="agent-detail-header" style="color:var(--agent-a)">
                <div class="avatar avatar-a" style="width:24px;height:24px;font-size:0.75rem;">A</div>
                ${escapeHtml(agentAName)}
              </div>
              <div class="agent-detail-label">Model</div>
              <div class="agent-detail-value">${escapeHtml(agentAModel)}</div>
              <div class="agent-detail-label">System Prompt</div>
              <div class="agent-system-prompt">${escapeHtml(agentAPrompt)}</div>
            </div>
            <div class="agent-detail-card card-b">
              <div class="agent-detail-header" style="color:var(--agent-b)">
                <div class="avatar avatar-b" style="width:24px;height:24px;font-size:0.75rem;">B</div>
                ${escapeHtml(agentBName)}
              </div>
              <div class="agent-detail-label">Model</div>
              <div class="agent-detail-value">${escapeHtml(agentBModel)}</div>
              <div class="agent-detail-label">System Prompt</div>
              <div class="agent-system-prompt">${escapeHtml(agentBPrompt)}</div>
            </div>
          </div>

        </div>
      `;

      if (debate.messages && debate.messages.length > 0) {
        debate.messages.forEach((msg) => {
          if (msg.role === 'user' && msg.turn === 0) {
            html += `
              <div class="message-card topic-card">
                <div class="message-header">
                  <div class="speaker-identity">
                    <div class="avatar avatar-topic">🎯</div>
                    <div><div class="speaker-name" style="color: var(--topic-color);">Initial Topic Submission</div></div>
                  </div>
                  <span class="turn-badge">Turn 0</span>
                </div>
                <div class="message-body">${renderMarkdown(msg.content)}</div>
                <div class="message-footer">
                  <span>${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                  <button class="copy-btn" onclick="copyText('${escapeQuotes(msg.content)}')">📋 Copy</button>
                </div>
              </div>
            `;
          } else if (msg.agent === 'A') {
            html += `
              <div class="message-card agent-a">
                <div class="message-header">
                  <div class="speaker-identity">
                    <div class="avatar avatar-a">A</div>
                    <div><div class="speaker-name" style="color: var(--agent-a);">${escapeHtml(agentAName)}</div></div>
                  </div>
                  <span class="turn-badge">Turn ${msg.turn}</span>
                </div>
                <div class="message-body">${renderMarkdown(msg.content)}</div>
                <div class="message-footer">
                  <span>${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                  <button class="copy-btn" onclick="copyText('${escapeQuotes(msg.content)}')">📋 Copy</button>
                </div>
              </div>
            `;
          } else if (msg.agent === 'B') {
            html += `
              <div class="message-card agent-b">
                <div class="message-header">
                  <div class="speaker-identity">
                    <div class="avatar avatar-b">B</div>
                    <div><div class="speaker-name" style="color: var(--agent-b);">${escapeHtml(agentBName)}</div></div>
                  </div>
                  <span class="turn-badge">Turn ${msg.turn}</span>
                </div>
                <div class="message-body">${renderMarkdown(msg.content)}</div>
                <div class="message-footer">
                  <span>${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                  <button class="copy-btn" onclick="copyText('${escapeQuotes(msg.content)}')">📋 Copy</button>
                </div>
              </div>
            `;
          } else if (msg.role === 'error') {
            const errorAgentName = msg.agent === 'A' ? agentAName : msg.agent === 'B' ? agentBName : 'System';
            html += `
              <div class="message-card error-card">
                <div class="message-header">
                  <div class="speaker-identity">
                    <div class="avatar avatar-error">⚠️</div>
                    <div><div class="speaker-name" style="color: #f87171;">${escapeHtml(errorAgentName)} — Failed</div></div>
                  </div>
                  <span class="turn-badge">Turn ${msg.turn}</span>
                </div>
                <div class="message-body" style="color:#fca5a5;">${renderMarkdown(msg.content)}</div>
                <div class="message-footer">
                  <span>${msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : ''}</span>
                </div>
              </div>
            `;
          }
        });
      }

      chatAreaEl.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return encodeURIComponent(str);
    }

    window.copyText = function(encodedText) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        alert('Argument copied to clipboard!');
      });
    };

    // Boot: auto-load all debates from the server
    fetchDebateList();
  </script>
</body>
</html>
